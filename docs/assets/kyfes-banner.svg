<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">kyfes — Know Your Frontend</title>
  <desc id="d">One src layout for React, Next.js, Vue, Angular and SvelteKit, with cookie sessions, RBAC on CRUD, TanStack Query and i18n, enforced by hooks in Claude Code and Codex.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042f2e"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#1e293b" stroke-width="1">
    <path d="M0 320 H1200"/><path d="M0 56 H1200"/>
  </g>

  <!-- wordmark -->
  <text x="64" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" fill="#f8fafc" letter-spacing="-2">ky<tspan fill="url(#accent)">fes</tspan></text>
  <text x="68" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">Know Your Frontend</text>
  <text x="68" y="226" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">Secure, predictable frontends built by AI agents —</text>
  <text x="68" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">one layout, one HTTP client, RBAC on every action,</text>
  <text x="68" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">enforced by hooks in Claude Code and Codex.</text>

  <!-- framework chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(68 296)"><rect width="74" height="28" rx="14" fill="#0e7490" opacity="0.35" stroke="#22d3ee"/><text x="37" y="19" text-anchor="middle" fill="#a5f3fc">React</text></g>
    <g transform="translate(150 296)"><rect width="84" height="28" rx="14" fill="#334155" opacity="0.6" stroke="#e2e8f0"/><text x="42" y="19" text-anchor="middle" fill="#f1f5f9">Next.js</text></g>
    <g transform="translate(242 296)"><rect width="62" height="28" rx="14" fill="#065f46" opacity="0.45" stroke="#34d399"/><text x="31" y="19" text-anchor="middle" fill="#a7f3d0">Vue</text></g>
    <g transform="translate(312 296)"><rect width="88" height="28" rx="14" fill="#9f1239" opacity="0.4" stroke="#fb7185"/><text x="44" y="19" text-anchor="middle" fill="#fecdd3">Angular</text></g>
    <g transform="translate(408 296)"><rect width="96" height="28" rx="14" fill="#9a3412" opacity="0.4" stroke="#fb923c"/><text x="48" y="19" text-anchor="middle" fill="#fed7aa">SvelteKit</text></g>
  </g>

  <!-- editor window with the src tree -->
  <g transform="translate(600 62)">
    <rect width="330" height="250" rx="14" fill="url(#win)" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="20" cy="20" r="5" fill="#f87171"/><circle cx="38" cy="20" r="5" fill="#fbbf24"/><circle cx="56" cy="20" r="5" fill="#34d399"/>
    <text x="80" y="25" font-family="Consolas, Menlo, monospace" font-size="13" fill="#64748b">src/</text>
    <g font-family="Consolas, Menlo, monospace" font-size="14">
      <text x="20" y="56" fill="#cbd5e1">├─ app/</text>
      <text x="20" y="78" fill="#cbd5e1">├─ pages/</text>
      <text x="20" y="100" fill="#cbd5e1">├─ features/<tspan fill="#2dd4bf">orders/</tspan></text>
      <text x="20" y="122" fill="#94a3b8">│  ├─ api/      <tspan fill="#64748b">queries · mutations</tspan></text>
      <text x="20" y="144" fill="#94a3b8">│  ├─ model/    <tspan fill="#64748b">zod schemas</tspan></text>
      <text x="20" y="166" fill="#94a3b8">│  ├─ locales/  <tspan fill="#64748b">it · en</tspan></text>
      <text x="20" y="188" fill="#94a3b8">│  └─ permissions.ts</text>
      <text x="20" y="210" fill="#cbd5e1">└─ shared/<tspan fill="#f472b6">api auth rbac i18n</tspan></text>
      <text x="104" y="232" fill="#f472b6">charts ui lib config</text>
    </g>
  </g>

  <!-- guard cards -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g transform="translate(956 62)">
      <rect width="200" height="74" rx="12" fill="#0f172a" stroke="#2dd4bf"/>
      <text x="16" y="30" font-size="15" font-weight="700" fill="#5eead4">🔒 HttpOnly session</text>
      <text x="16" y="54" font-size="13" fill="#94a3b8">Secure · SameSite · CSRF</text>
    </g>
    <g transform="translate(956 150)">
      <rect width="200" height="74" rx="12" fill="#0f172a" stroke="#a78bfa"/>
      <text x="16" y="30" font-size="15" font-weight="700" fill="#c4b5fd">🛡 can('update', Order)</text>
      <text x="16" y="54" font-size="13" fill="#94a3b8">CASL RBAC on CRUD</text>
    </g>
    <g transform="translate(956 238)">
      <rect width="200" height="74" rx="12" fill="#0f172a" stroke="#f472b6"/>
      <text x="16" y="30" font-size="15" font-weight="700" fill="#f9a8d4">✓ hooks + stop gate</text>
      <text x="16" y="54" font-size="13" fill="#94a3b8">Claude Code · Codex</text>
    </g>
  </g>
  <g stroke="#475569" stroke-width="2" stroke-dasharray="4 4" fill="none">
    <path d="M930 99 H956"/><path d="M930 187 H956"/><path d="M930 275 H956"/>
  </g>
  <text x="64" y="356" font-family="Consolas, Menlo, monospace" font-size="13" fill="#64748b">axios · TanStack Query · Zod · CASL · i18n · Recharts / ECharts · Vitest · MSW · Playwright + axe</text>
</svg>
