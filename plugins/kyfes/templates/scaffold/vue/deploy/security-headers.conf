# nginx snippet for the SPA (include it inside the `server { ... }` block, HTTPS only).
# /api is reverse-proxied to the BFF on the same origin: cookies stay first-party,
# the session cookie is `__Host-session; HttpOnly; Secure; SameSite=Lax` (set by the BFF).

root /usr/share/nginx/html;

# --- Security headers (also on error pages: `always`) -----------------------------------
# Vite emits only external, hashed scripts: no inline scripts → no nonce needed, no 'unsafe-inline'.
# style-src 'self': Vue binds styles through the CSSOM and vue-echarts uses constructable
# stylesheets, both allowed. ECharts tooltips use renderMode 'richText' (no innerHTML).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;

server_tokens off;

# --- Hashed assets: cache forever -----------------------------------------------------------
# (nginx does not inherit add_header into a location that defines its own: repeat the headers.)
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# --- Never serve source maps --------------------------------------------------------------
location ~* \.map$ {
    return 404;
}

# --- API: same-origin reverse proxy to the BFF ----------------------------------------------
location /api/ {
    proxy_pass https://bff.internal;   # replace with the BFF upstream
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# --- SPA fallback: index.html is never cached --------------------------------------------
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
}
