# Snippet nginx per servire la build Angular (dist/scaffold-angular/browser) — da includere nel server {}.
# Il backend (BFF) è dietro /api sulla stessa origine: cookie __Host-session, nessun CORS.
#
# CSP in due parti, entrambe applicate dal browser (una risorsa deve passare tutte le policy):
#  1. <meta> generato dalla build (angular.json → security.autoCsp): script-src con hash degli script
#     inline di index.html + 'strict-dynamic' (i chunk lazy ereditano la fiducia). I token
#     'unsafe-inline' e https: nel meta sono solo fallback per browser senza CSP3: vengono ignorati
#     in presenza di hash/'strict-dynamic'.
#  2. header qui sotto: tutto il resto. NON contiene default-src/script-src: farebbe da fallback per
#     gli script e bloccherebbe il loader inline (senza nonce) generato da autoCsp. Per questo ogni
#     direttiva di fetch è elencata esplicitamente.
# Gli <style> (stili dei componenti, critical CSS) usano il nonce: index.html contiene il segnaposto
# __CSP_NONCE__ (ngCspNonce) che sub_filter sostituisce con $request_id a ogni risposta.

root /usr/share/nginx/html;
index index.html;
server_tokens off;

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;

# Source map di produzione (hidden) mai pubbliche.
location ~* \.map$ {
  return 404;
}

# Asset con hash nel nome: cache immutabile.
location ~* ^/(chunk|main|polyfills|styles)-[A-Za-z0-9_-]+\.(js|css)$ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  try_files $uri =404;
}

# index.html e rotte della SPA: mai in cache, CSP con nonce per richiesta.
location / {
  try_files $uri $uri/ /index.html;
  sub_filter_once off;
  sub_filter_types text/html;
  sub_filter "__CSP_NONCE__" $request_id;
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header X-Frame-Options "DENY" always;
  # base-uri 'self' (non 'none'): Angular usa <base href="/"> per risolvere chunk e rotte.
  add_header Content-Security-Policy "style-src 'self' 'nonce-$request_id'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'none'; child-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
}

# API: proxy verso il BFF (stessa origine). Nessuna cache.
# Un add_header in una location ANNULLA tutti quelli del server: gli header di sicurezza vanno ripetuti qui.
location /api/ {
  proxy_pass https://bff.internal.example.com;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  # TLS verso il BFF: SNI e verifica del certificato (senza, un MITM interno resta invisibile).
  proxy_ssl_server_name on;
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 2;
  # OBBLIGATORIO prima del deploy: con proxy_ssl_verify on e senza CA fidata nginx rifiuta il BFF (502).
  # Bundle di sistema per certificati pubblici, oppure la CA interna se il BFF usa una PKI privata:
  # proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  add_header Cache-Control "no-store" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header X-Frame-Options "DENY" always;
  # Le risposte JSON non vanno mai interpretate come documento attivo.
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
}
