# kyfes — nginx snippet for the React SPA (Vite build in /usr/share/nginx/html).
# Include it inside the `server { ... }` block that serves the app over HTTPS:
#   include /etc/nginx/snippets/security-headers.conf;
# The BFF (OIDC login, session cookie `__Host-session`, XSRF-TOKEN cookie) is reached on the
# same origin under /api, so `connect-src 'self'` is enough and no CORS is needed.

# ---------------------------------------------------------------- security headers
# Vite emits only external hashed scripts/styles: no inline script, so no nonce is required.
# If you add an inline script, use a nonce (sub_filter / njs) — never 'unsafe-inline'.
# React applies the `style` prop through CSSOM (element.style), which CSP does not block, so
# no 'unsafe-inline' is needed for styles either.
set $kyfes_csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";

add_header Content-Security-Policy $kyfes_csp always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

server_tokens off;

# ---------------------------------------------------------------- caching
# Hashed assets (vite: /assets/<name>-<hash>.js|css): cache forever.
location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # add_header in a location replaces the server-level ones: repeat the security headers.
    add_header Content-Security-Policy $kyfes_csp always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Never serve source maps (they are not generated in production, this is a safety net).
location ~* \.map$ {
    return 404;
}

# The MSW worker exists only for local mocks: never serve it in production.
location = /mockServiceWorker.js {
    return 404;
}

# SPA fallback: index.html is never cached, so a deploy is picked up immediately.
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Content-Security-Policy $kyfes_csp always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
}

